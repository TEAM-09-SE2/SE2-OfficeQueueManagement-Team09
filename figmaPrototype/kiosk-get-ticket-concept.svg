<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="QueueFlow kiosk get ticket concept">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2B1D79"/>
      <stop offset="100%" stop-color="#4E42E0"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A31A2"/>
      <stop offset="100%" stop-color="#2F277F"/>
    </linearGradient>
    <linearGradient id="ticketBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F3FF"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#14104D" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1400" cy="120" r="260" fill="#7E74FF" opacity="0.22"/>
  <circle cx="210" cy="860" r="300" fill="#5F54ED" opacity="0.18"/>

  <rect x="56" y="42" width="1488" height="80" rx="20" fill="#FFFFFF" opacity="0.10"/>
  <circle cx="108" cy="82" r="24" fill="#FFFFFF"/>
  <rect x="100" y="74" width="16" height="16" rx="4" fill="#4E42E0"/>
  <text x="146" y="92" fill="#FFFFFF" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">QueueFlow</text>
  <text x="1380" y="92" text-anchor="end" fill="#DCD9FF" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">Kiosk Mode</text>

  <text x="800" y="210" text-anchor="middle" fill="#FFFFFF" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="78" font-weight="800">Get Your Ticket</text>
  <text x="800" y="258" text-anchor="middle" fill="#D9D5FF" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="30" font-weight="500">Tap a service to print your ticket and join the queue.</text>

  <g filter="url(#softShadow)">
    <rect x="130" y="318" width="400" height="320" rx="34" fill="url(#cardBg)" stroke="#8E87FF" stroke-opacity="0.6"/>
    <circle cx="220" cy="406" r="42" fill="#5F54ED"/>
    <rect x="206" y="390" width="28" height="32" rx="6" fill="#FFFFFF"/>
    <text x="182" y="500" fill="#FFFFFF" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="44" font-weight="700">General</text>
    <text x="182" y="548" fill="#CBC7FF" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="24" font-weight="500">Information and support requests</text>
    <text x="182" y="596" fill="#9BF5C6" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Avg wait: 5 min</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="600" y="318" width="400" height="320" rx="34" fill="url(#cardBg)" stroke="#8E87FF" stroke-opacity="0.6"/>
    <circle cx="690" cy="406" r="42" fill="#38CF9D"/>
    <rect x="677" y="392" width="26" height="30" rx="5" fill="#0F6B4C"/>
    <line x1="683" y1="404" x2="697" y2="404" stroke="#E4FFF5" stroke-width="3"/>
    <line x1="683" y1="412" x2="697" y2="412" stroke="#E4FFF5" stroke-width="3"/>
    <text x="652" y="500" fill="#FFFFFF" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="44" font-weight="700">Administrative</text>
    <text x="652" y="548" fill="#CBC7FF" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="24" font-weight="500">Certificates and official records</text>
    <text x="652" y="596" fill="#9BF5C6" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Avg wait: 12 min</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="1070" y="318" width="400" height="320" rx="34" fill="url(#cardBg)" stroke="#8E87FF" stroke-opacity="0.6"/>
    <circle cx="1160" cy="406" r="42" fill="#F6B23E"/>
    <path d="M1150 422 L1150 402 L1160 394 L1170 402 L1170 422" fill="#7A4A00"/>
    <circle cx="1160" cy="404" r="4" fill="#FDE9C1"/>
    <text x="1122" y="500" fill="#FFFFFF" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="44" font-weight="700">Cadastral</text>
    <text x="1122" y="548" fill="#CBC7FF" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="24" font-weight="500">Property and registry services</text>
    <text x="1122" y="596" fill="#FFDFA9" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Avg wait: 20 min</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="130" y="700" width="840" height="220" rx="28" fill="#FFFFFF" opacity="0.98"/>
    <text x="176" y="772" fill="#211A66" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="40" font-weight="800">After selection</text>
    <text x="176" y="816" fill="#41398F" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="28" font-weight="500">Your ticket is printed instantly and appears on the public display queue.</text>
    <rect x="176" y="840" width="284" height="56" rx="14" fill="#4E42E0"/>
    <text x="318" y="877" text-anchor="middle" fill="#FFFFFF" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Print Example Ticket</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="1030" y="698" width="440" height="224" rx="28" fill="url(#ticketBg)"/>
    <text x="1070" y="760" fill="#4D45A2" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">SAMPLE TICKET</text>
    <line x1="1070" y1="772" x2="1430" y2="772" stroke="#D8D5FF" stroke-width="2"/>
    <text x="1070" y="824" fill="#8A84D8" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Service</text>
    <text x="1290" y="824" text-anchor="end" fill="#262059" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">General</text>
    <text x="1070" y="874" fill="#8A84D8" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Ticket Number</text>
    <text x="1290" y="878" text-anchor="end" fill="#1F1A59" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="64" font-weight="900">A043</text>
    <text x="1070" y="908" fill="#8A84D8" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Estimated Wait</text>
    <text x="1290" y="908" text-anchor="end" fill="#2A246A" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">~ 15 min</text>
  </g>

  <rect x="56" y="940" width="1488" height="40" rx="14" fill="#FFFFFF" opacity="0.12"/>
  <text x="102" y="967" fill="#E9E7FF" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">Language: EN / IT</text>
  <text x="540" y="967" fill="#E9E7FF" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">Accessibility Mode</text>
  <text x="1438" y="967" text-anchor="end" fill="#E9E7FF" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">Need help? Press and hold for assistance</text>
</svg>
